// Configuración de plugins
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

// Información del proyecto
group = 'com.alvaro'
version = '0.0.1-SNAPSHOT'
description = 'taskmanager'

// Configuración de Java
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Configuración de compilación
configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// Repositorios para descargar dependencias
repositories {
    mavenCentral()
}

// Dependencias del proyecto
dependencies {
    // Spring Boot starter para JPA y persistencia de datos
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Spring Boot starter para crear aplicaciones web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring Boot starter para seguridad
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Lombok para generar getters, setters y constructores automáticamente
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Conector MySQL para la base de datos
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Dependencias de prueba - Spring Boot Test incluye JUnit 5
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Lanzador de JUnit Platform para ejecutar pruebas
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Dependencias JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
}

// Configuración de tareas
tasks.named('test') {
    // Usa JUnit Platform para ejecutar las pruebas
    useJUnitPlatform()
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation 'org.springframework.boot:spring-boot-starter-security'

    implementation 'org.springframework.kafka:spring-kafka'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'

    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'

    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
}