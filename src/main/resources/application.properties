# DATASOURCE
spring.datasource.url=jdbc:mysql://localhost:3306/taskmanager_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=taskmanager
spring.datasource.password=taskmanager123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# SERVER
server.port=8082

# USER
spring.security.user.name=alvaro
spring.security.user.password=1234

# KAFKA

# Servidor de arranque del broker (KRaft del docker-compose)
spring.kafka.bootstrap-servers=localhost:9092

# Topic donde se publican y consumen los mensajes de usuarios.
# Definido aquí para que productor y consumer usen el mismo nombre.
app.kafka.topic.usuarios=usuarios-topic

# Grupo de consumidores: las instancias con el mismo grupo
# se reparten las particiones del topic.
app.kafka.consumer-group=crud-group
